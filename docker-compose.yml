services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobautomation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    image: myjobautomation00/jobautomation:v1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/jobautomation
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      OPENAI_KEY: ${OPENAI_KEY}
      MAIL_USER: ${MAIL_USER}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}
      APP_BASE_URL: http://localhost:8080
    shm_size: "1gb"            # Chromium needs more shared memory
    volumes:
      - ./apply-screenshots:/app/apply-screenshots

volumes:
  pgdata: