spring.application.name=JobAutomation

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobautomation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update


spring.ai.openai.api-key=${OPENAI_KEY}

jobs.greenhouse.boards=datadog,airbnb,stripe,figma,mongodb,elastic,reddit,dropbox,coinbase,affirm,samsara
jobs.lever.companies=spotify,palantir,wealthfront

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG

app.base-url=http://localhost:8080
app.mail-from=${MAIL_USER}
app.confirmation-days=7

