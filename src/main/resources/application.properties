spring.application.name=JobAutomation

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=sa
spring.h2.console.enabled=true

spring.ai.openai.api-key=${OPENAI_KEY}

jobs.greenhouse.boards=datadog,airbnb,stripe,figma,mongodb,elastic,reddit,dropbox,coinbase,affirm,samsara
jobs.lever.companies=spotify,palantir,wealthfront

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



app.base-url=http://localhost:8080
app.mail-from=${MAIL_USER}
app.confirmation-days=7